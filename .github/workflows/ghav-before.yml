name: "ghav before: Playwright Tests"
"on":
  push:
    branches:
      - ghav/dev/1405
    paths:
      - .ghav/before
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: frontend
      - run: docker compose build prestart backend frontend
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend mailcatcher
      - name: Run Playwright tests
        run: npx playwright test --reporter=html --fail-on-flaky-tests --trace=retain-on-failure
        working-directory: frontend
      - run: docker compose down -v --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
          include-hidden-files: true
  e2e-alls-green:
    if: always()
    needs:
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
  test-docker-compose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: docker compose build prestart backend frontend
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db adminer prestart backend frontend proxy mailcatcher
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:5173
      - run: docker compose down -v --remove-orphans
